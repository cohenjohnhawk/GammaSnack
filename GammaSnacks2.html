		function randomCharType(){

		function attributeModifier(number) {
			
			let modifier;
			if (number > 15){ 
				modifier = "+" + parseInt(number - 15);
			}
			else if (number < 6) {
				modifier = parseInt (number - 6);
			}
			else {
				modifier = 0;
			}
			return modifier;
